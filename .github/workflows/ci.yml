name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync

      - name: Tests
        run: uv run pytest

      - name: Committed results reproduce byte for byte
        run: |
          PYTHONPATH=. uv run python -m recon.cli eval
          git diff --exit-code results/

      - name: Invariants hold on a fresh demo day
        run: PYTHONPATH=. uv run python -m recon.cli demo
